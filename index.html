<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>everything is bicycle</title>
  <link rel="icon" href="Everythingisbicyclelogo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Meeting Point</h1>

    <img class="ppl" src="ppl.png" alt="" aria-hidden="true">

    <div class="discord-wrap">
      <img class="cta-arrow cta-arrow-left" src="left arrows.png" alt="" aria-hidden="true">
      <a class="discord-cta" href="https://discord.gg/zT66NwjuYv">
        <span class="cta-shine" aria-hidden="true"></span>
        Join the Discord ❤️
        <span class="orbit-track">
          <img class="bicycle" src="b.png" alt="" aria-hidden="true">
        </span>
        <span class="lap-flag" aria-hidden="true">🪞</span>
        <span class="lap-success" aria-hidden="true">🎉</span>
      </a>
      <img class="cta-arrow cta-arrow-right" src="right arrows.png" alt="" aria-hidden="true">
    </div>

    <nav class="links">
      <a href="https://www.instagram.com/everythingisbicycle/">Instagram</a>
    </nav>
    
  </main>

  <div class="bike-field" aria-hidden="true"></div>
  <!-- <button type="button" class="bike-counter" id="bike-counter">Trips in transit: 1</button> -->
  <div class="lap-counter" id="lap-counter">Laps: 0</div>

  <script src="script.js"></script>
</body>
</html>
